// v66b: dados de origem também nos blocos agrupados (ranking, matriz, painel, composição, colunas)
function v66Base(d){ return String(d).replace(/\s+—\s+[^—]*$/,'').replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); }
function v66Cab(lbls){                              // cabeçalho comum: palavras iguais no começo e no fim
  const ts=lbls.map(l=>v66Base(l).split(' ')); if(ts.every(t=>t.join(' ')===ts[0].join(' '))) return ts[0].join(' ');
  const mn=Math.min(...ts.map(t=>t.length)); let i=0; while(i<mn&&ts.every(t=>t[i]===ts[0][i])) i++;
  let j=0; while(j<mn-i&&ts.every(t=>t[t.length-1-j]===ts[0][ts[0].length-1-j])) j++;
  const c=[...ts[0].slice(0,i),...ts[0].slice(ts[0].length-j)].join(' '); return c||null; }
function htmlBrutosGrupo(g,sel,visual){
  const linhas=g.map(e=>({e,bs:brutosDoInd(e.ind)})).filter(x=>x.bs.length);
  if(!linhas.length) return '';
  const chave=b=>slug(b.area)+'|'+slug(b.dado), uso={};
  linhas.forEach(x=>x.bs.forEach(b=>{ uso[chave(b)]=(uso[chave(b)]||0)+1; }));
  const fmtV=({v,rot})=>`${nf(v,2)}${rot&&rot!=='soma'?' <small>('+rot+')</small>':''}`;
  const tit=`<span class="v51-orig-t">Dados de origem · ${periodoLbl(sel)}</span>`;
  // dados compartilhados entre os indicadores do bloco (ex.: SUS/Particular/Outros): uma linha só, sem repetir
  if(linhas.length===1 || Object.values(uso).some(n=>n>1)){
    const vistos=new Set(), bs=[]; linhas.forEach(x=>x.bs.forEach(b=>{ const k=chave(b); if(!vistos.has(k)){ vistos.add(k); bs.push(b); } }));
    if(bs.length<2) return '';
    const lidos=bs.map(b=>({b,r:valBruto(b,sel)})); if(lidos.every(x=>x.r.v===null||x.r.v===undefined)) return '';
    return `<div class="v51-orig">${tit}<div class="v51-orig-l">${lidos.map(({b,r})=>`<span class="v51-orig-i"><b>${r.v===null||r.v===undefined?'—':fmtV(r)}</b> ${escH(b.dado)}</span>`).join('')}</div></div>`;
  }
  // um par de dados por indicador (agendas, participação, satisfação, periodicidade): tabela
  const n=linhas[0].bs.length; if(n<2 || !linhas.every(x=>x.bs.length===n)) return '';
  const mesmas=linhas.every(x=>x.bs.map(b=>v66Base(b.dado)).sort().join('|')===linhas[0].bs.map(b=>v66Base(b.dado)).sort().join('|'));
  const cols=mesmas ? linhas[0].bs.map(b=>v66Base(b.dado)) : [...Array(n).keys()].map(k=>v66Cab(linhas.map(x=>x.bs[k].dado))||('Dado '+(k+1)));
  const pega=(x,k)=> mesmas ? x.bs.find(b=>v66Base(b.dado)===cols[k]) : x.bs[k];
  let rows=linhas.map(x=>({x,L:leitura(x.e.ind,sel),vs:cols.map((_,k)=>valBruto(pega(x,k),sel))})).filter(r=>r.vs.some(v=>v.v!==null&&v.v!==undefined));
  if(!rows.length) return '';
  // título da linha sem o prefixo que todas repetem (ex.: "Conformidade de Periodicidade — ")
  const nomes=rows.map(r=>tituloEnt(r.x.e)), pre=nomes[0].split(' — ')[0]+' — ';
  const curto= rows.length>1 && nomes.every(n=>n.startsWith(pre)) ? (n=>n.slice(pre.length)) : (n=>n);
  rows.forEach((r,i)=>{ r.nome=curto(nomes[i]); });
  if(visual==='ranking'){ const ok=r=>r.L.cur!==null&&r.L.cur!==undefined&&!isNaN(r.L.cur); rows.sort((a,b)=>(ok(b)-ok(a))||((ok(a)&&ok(b))?b.L.cur-a.L.cur:0)); }
  return `<div class="v51-orig">${tit}<table class="v66-ot"><thead><tr><th></th>${cols.map(c=>`<th>${escH(c)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr><td>${escH(r.nome)}</td>${r.vs.map(v=>`<td>${v.v===null||v.v===undefined?'—':fmtV(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

}
function htmlAreaLayout(area,ents){
  const sel=getMesesSelecionados(), lbl=periodoLbl(sel);
  const subs=[]; ents.forEach(e=>{ if(!subs.includes(e.subaba)) subs.push(e.subaba); });
  const atual=subs.includes(EXT.subaba[area.id])?EXT.subaba[area.id]:subs[0];
  // frase da área (regra)
  const leit=ents.filter(e=>e.visual!=='composicao').map(e=>({e,L:leitura(e.ind,sel)}));
  const lidos=leit.filter(x=>x.L.sc!=='sem'), c=k=>lidos.filter(x=>x.L.sc===k).length;
  const uA=Math.max(-1,...ents.map(e=>{ const u=ultLanc(getData(e.ind)); return u===null?-1:u; }));
  const lblF=lblFoco(lidos.map(x=>x.L.m),sel);
  let frase = !lidos.length ? `Nenhum indicador com leitura em ${lbl}.`+(uA>=0?` Último lançamento: ${MESES[uA]}.`:'') : `Em ${lblF}, ${c('verde')} de ${lidos.length} indicadores no alvo, ${c('amarelo')} em atenção e ${c('vermelho')} críticos.`;
  const piores=lidos.filter(x=>x.L.sc==='vermelho').map(x=>({...x,gap:x.L.meta!==0?(x.e.ind.invertido?x.L.cur-x.L.meta:x.L.meta-x.L.cur)/Math.abs(x.L.meta):0})).sort((a,b)=>(a.L.meta===0)-(b.L.meta===0) || b.gap-a.gap);   // v64: meta zero não vira automaticamente o maior desvio
  if(piores.length){ const p=piores[0]; frase+=` Maior desvio: ${escH(nomeEnt(p.e))}, ${fmtVal(p.L.cur,p.e.ind)} contra ${rotMeta(p.e.ind,p.L.meta)} ${fmtMeta(p.L.meta,p.e.ind)}.`; }
  // faixa de destaque
  const kpis=ents.filter(e=>e.destaque).map(e=>htmlKpi(e,sel)).join('');
  const chips=subs.map(s=>`<button type="button" class="v51-chip${s===atual?' ativo':''}" onclick="v51Subaba('${area.id}','${escH(s).replace(/'/g,"\\'")}')">${escH(s)}</button>`).join('');
  // conteúdo da subaba
  const noSub=ents.filter(e=>e.subaba===atual), feitos=new Set(), cardInds=[];
  let blocos='', grade='';
  noSub.forEach(e=>{
    if((e.visual==='matriz'||e.visual==='composicao'||e.visual==='ranking'||e.visual==='colunas'||e.visual==='colunas_total'||e.visual==='painel'||e.visual==='razao') && e.grupo){
      if(feitos.has(e.grupo)) return; feitos.add(e.grupo);
      const g=noSub.filter(x=>x.grupo===e.grupo);
      const sg=selGrupo(g,sel);   // v67: o bloco julga o último mês lançado do grupo
      const _b= e.visual==='matriz' ? htmlMatriz(g,sg) : e.visual==='ranking' ? htmlRanking(g,sg) : e.visual==='colunas'||e.visual==='colunas_total' ? htmlColunas(g,sg,e.visual==='colunas_total') : e.visual==='painel' ? htmlPainel(g,sg) : e.visual==='razao' ? htmlRazao(g,sg) : htmlComposicao(g,sg);
      { const _o=g.map(x=>htmlNotasInd(x.ind,sel)).join('')+htmlBrutosGrupo(g,sg,e.visual); blocos+= _o ? _b.replace(/<\/div>\s*$/,_o+'</div>') : _b; }
      return;
    }
    grade+=`<div class="v51-slot${e.visual==='card_largo'?' v61-largo':''}">${htmlCard(e.ind,(e.grupo?e.grupo+' — ':'')+tituloEnt(e))}${htmlNotasInd(e.ind,sel)}${htmlBrutosInd(e.ind,selFoco(getData(e.ind),sel))}</div>`; cardInds.push(e.ind);
  });
  const corpo=(grade?`<div class="ind-grid">${grade}</div>`:'')+blocos;
  const html=`<div class="tab-panel active"><section class="area-wrap">
<div class="area-head">
  <div class="area-pill">${area.num} &nbsp;·&nbsp; Área</div>
  <h2 class="area-h2"><u>${area.label}</u></h2>
  <div class="area-sub">Responsável: <strong>${area.responsavel}</strong> &nbsp;·&nbsp; Período: <strong>${lbl}</strong></div>
</div>
<p class="v51-frase">${frase}</p>
${kpis?`<h3 class="v57-sec">Destaques</h3><div class="v51-kpis">${kpis}</div><h3 class="v57-sec">Indicadores</h3>`:''}
${subs.length>1?`<nav class="v51-chips" aria-label="Temas da área">${chips}</nav>`:''}
${corpo}
</section></div>`;
  return {html,cardInds};
}
function v51Subaba(areaId,nome){ EXT.subaba[areaId]=nome; renderMain(); }

const _renderMainBase = renderMain;
renderMain = function(){
  if(ST.loading||ST.error) return _renderMainBase();
  const root=document.getElementById('mainContent');
  if(ST.tab==='capa'){ destroyCharts(); root.innerHTML=htmlResumo(); return; }
  const area=AREAS.find(a=>a.id===ST.tab);
  const ents=area && layoutDaArea(area);
  if(!ents){
    _renderMainBase();
    if(area){ const sel=getMesesSelecionados();              // área sem LAYOUT: brutos entram dentro do card
      area.indicadores.forEach(ind=>{ const c=document.getElementById('card_'+ind.id), b=htmlNotasInd(ind,sel)+htmlBrutosInd(ind,selFoco(getData(ind),sel)); if(c&&b) c.insertAdjacentHTML('beforeend',b); }); }
    return;
  }
  destroyCharts();
  const r=htmlAreaLayout(area,ents);
  root.innerHTML=r.html;
  setTimeout(()=>r.cardInds.forEach(ind=>buildOneChart(ind,false)),60);
};

// v67b: na tela, travessão vira hífen (pedido 23/10). Só no texto exibido: os rótulos da central seguem com travessão para a ligação por nome.
function v67Traco(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())) if(/[—–]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/[—–]/g,'-');
  root.querySelectorAll('[title]').forEach(e=>{ const t=e.getAttribute('title'); if(/[—–]/.test(t)) e.setAttribute('title',t.replace(/[—–]/g,'-')); });
}
const _renderMainV67 = renderMain;
renderMain = function(){ _renderMainV67.apply(this, arguments); v67Traco(document.getElementById('mainContent')); };
const _updateChipsV67 = updateChips;
updateChips = function(){ _updateChipsV67.apply(this, arguments); v67Traco(document.querySelector('.topo-fixo')); document.title=document.title.replace(/[—–]/g,'-'); };
