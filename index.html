<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Operacional · AHCROS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#011E3C;
  --teal:#0F4245;
  --mint:#E0EEE7;
  --sage:#A8CCA8;
  --ink:#130F10;
  --success:#2F8F6E;
  --warning:#C58B2A;
  --danger:#B33A3A;
  --info:#3F598C;
  --mint-dark:#b8d4c0;
  --text-muted:rgba(var(--fg-rgb),0.55);
  --border-dark:rgba(var(--fg-rgb),0.1);
  --bg-card:rgba(var(--fg-rgb),0.04);
  /* --- CORES DE PÁGINA: revertidas pro tema escuro original (era claro no pacote v39→v40) --- */
  --bg-page:var(--navy);
  --ink-page:var(--fg);
  --ink-page-muted:var(--text-muted);
  --rule-page:var(--border-dark);
  --accent-page:var(--accent-fg);
  --ok-page:var(--success); --warn-page:var(--warning); --bad-page:var(--danger);
  /* --- SUPERFÍCIES ESCURAS: exatamente as cores que o card já tinha --- */
  --surface:#062B3F;                   /* = rgba(15,66,69,.35) sobre o navy */
  --surface-hover:#093241;             /* = .55 */
  --surface-exp:#0A3542;               /* = .65 */
  --surface-lista:#072C40;             /* = .40 */
}
/* v65 — TEMA CLARO (pedido da Janis, 14/10): fundo claro para destacar os gráficos na apresentação.
   Marca preservada (navy/mint/sage) no login; o resto lê os tokens abaixo. */
:root{
  --fg:#011E3C; --fg-rgb:1,30,60; --on-fg:#FFFFFF;
  --accent-fg:#2F7A5E; --accent-rgb:47,122,94;
  --text-muted:rgba(1,30,60,.62); --border-dark:rgba(1,30,60,.12); --bg-card:rgba(1,30,60,.03);
  --bg-page:#EEF3F0; --ink-page:var(--fg); --ink-page-muted:var(--text-muted);
  --rule-page:var(--border-dark); --accent-page:var(--accent-fg);
  --surface:#FFFFFF; --surface-hover:#F6F9F7; --surface-exp:#FFFFFF; --surface-lista:#FAFCFB;
}

*{box-sizing:border-box;margin:0;padding:0;}
.ind-card,.area-card-mini,.exec-lista{color:var(--fg);}
html{scroll-behavior:smooth;}
body{
  font-family:'Montserrat',-apple-system,sans-serif;
  background:var(--bg-page);
  color:var(--ink-page);
  font-size:14px;line-height:1.55;
  /* 'clip' em vez de 'hidden': hidden transforma o body em contêiner de rolagem e quebra
     o position:sticky do cabeçalho. 'clip' corta o transbordo horizontal sem criar rolagem. */
  overflow-x:hidden;
  overflow-x:clip;
}

/* LOGIN */
.login-screen{
  position:fixed;inset:0;z-index:1000;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.login-bg{position:absolute;inset:0;opacity:.08;pointer-events:none;}
.login-bg svg{width:100%;height:100%;display:block;}
.login-card{
  position:relative;z-index:1;
  background:rgba(224,238,231,.04);
  border:1px solid rgba(224,238,231,.14);
  backdrop-filter:blur(20px);
  padding:48px 56px;border-radius:8px;
  width:100%;max-width:400px;text-align:center;
}
.login-logo{display:flex;justify-content:center;margin-bottom:28px;}
.login-logo img{height:32px;}
.login-nortmont-logo{height:42px;width:auto;display:block;color:var(--mint);filter:drop-shadow(0 0 6px rgba(168,204,168,.7)) drop-shadow(0 0 16px rgba(168,204,168,.35));}
.login-eyebrow{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.login-title{font-size:24px;font-weight:700;color:var(--mint);letter-spacing:-.5px;margin-bottom:32px;}
.login-input{
  width:100%;padding:14px 18px;
  background:rgba(224,238,231,.04);
  border:1px solid rgba(224,238,231,.18);
  border-radius:50px;color:var(--mint);
  font-family:inherit;font-size:16px;
  text-align:center;letter-spacing:.5em;
  outline:none;transition:all .2s;margin-bottom:14px;
}
.login-input:focus{border-color:var(--mint);background:rgba(224,238,231,.08);}
.login-input::placeholder{color:rgba(224,238,231,.25);letter-spacing:.5em;}
.login-btn{
  width:100%;padding:14px 28px;
  background:var(--mint);color:var(--navy);
  font-family:inherit;font-weight:700;font-size:11px;
  border:none;border-radius:50px;cursor:pointer;
  letter-spacing:2px;text-transform:uppercase;transition:all .2s;
}
.login-btn:hover{background:var(--sage);}
.login-error{color:var(--danger);font-size:12px;margin-top:12px;min-height:16px;font-weight:600;}
.login-sub{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:28px;}
.login-google-btn{
  width:100%;padding:13px 20px;
  background:var(--mint);color:var(--navy);
  font-family:inherit;font-weight:700;font-size:12.5px;
  border:none;border-radius:50px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  letter-spacing:.3px;transition:all .2s;
}
.login-google-btn:hover{background:var(--sage);}
.login-google-btn:disabled{opacity:.45;cursor:default;}
.login-google-btn svg{width:16px;height:16px;flex-shrink:0;}
.login-note{font-size:10.5px;color:var(--text-muted);line-height:1.6;margin-top:24px;padding-top:20px;border-top:1px solid rgba(224,238,231,.1);}
#app{display:none;}
#app.authed{display:block;}

/* HEADER */
/* Cabeçalho: as três faixas vivem dentro de um único bloco sticky. Antes cada uma era
   position:fixed e o topo do period-bar era calculado por JS no boot — qualquer mudança de
   altura depois da medição (fonte carregando, scrollbar do tabs, resize) abria uma fresta
   transparente entre as abas e o período, por onde o conteúdo aparecia. Com sticky a pilha
   ocupa espaço no fluxo e não há mais o que medir. */
.topo-fixo{position:sticky;top:0;z-index:100;background:var(--bg-page);}
.top-bar{
  padding:0 32px;height:44px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-nortmont{display:flex;align-items:center;}
.brand-nortmont-logo{height:22px;width:auto;display:block;color:var(--fg);filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.65)) drop-shadow(0 0 12px rgba(var(--accent-rgb),.3));}
.brand-divider{width:1px;height:22px;background:var(--rule-page);}
.brand-client{font-size:10px;color:var(--ink-page-muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;}
.brand-client strong{color:var(--ink-page);}
.top-meta{font-size:10px;color:var(--ink-page-muted);letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.top-meta strong{color:var(--ink-page);font-weight:600;}

/* ABAS */
.tabs-nav{
  background:var(--bg-page);
  overflow-x:auto;scrollbar-width:thin;
}
.tabs-nav::-webkit-scrollbar{height:3px;}
.tabs-nav::-webkit-scrollbar-thumb{background:rgba(var(--fg-rgb),.25);}
.tabs-list{display:flex;gap:3px;padding:0 28px 6px;min-width:max-content;}
.tab-btn{
  background:transparent;outline:none;cursor:pointer;
  color:var(--ink-page-muted);font-family:inherit;font-size:10.5px;font-weight:500;
  padding:5px 11px;border-radius:20px;
  transition:all .18s;white-space:nowrap;border:1px solid var(--rule-page);
}
.tab-btn:hover{color:var(--ink-page);background:rgba(var(--fg-rgb),.07);border-color:rgba(var(--fg-rgb),.3);}
.tab-btn.active{
  color:var(--fg);background:var(--fg);
  border-color:var(--fg);font-weight:700;
}
.tab-num{font-weight:700;opacity:.6;margin-right:4px;font-size:9.5px;}

/* PERÍODO */
.period-bar{
  background:var(--bg-page);
  border-bottom:1px solid var(--rule-page);
  box-shadow:0 3px 12px rgba(1,30,60,.07);
  padding:7px 28px 8px;
  display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;
}
.period-label{
  font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--ink-page-muted);flex-shrink:0;
}
.period-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.period-divider{width:1px;align-self:stretch;background:rgba(var(--fg-rgb),.16);margin:2px 4px;flex-shrink:0;}
/* Não selecionado: pílula clara e sólida (alto contraste no fundo escuro). */
.period-chip{
  background:rgba(var(--fg-rgb),.88);border:1px solid rgba(var(--fg-rgb),.88);
  color:var(--on-fg);font-family:inherit;font-size:10.5px;font-weight:600;
  padding:5px 11px;border-radius:50px;cursor:pointer;letter-spacing:.4px;
  transition:all .15s;white-space:nowrap;
}
.period-chip:hover{background:var(--fg);border-color:var(--fg);}
/* Selecionado: quase a cor do fundo (funde com o period-bar) + contorno neon sage. */
.period-chip.active{
  background:var(--surface);color:var(--fg);
  border:1.5px solid var(--accent-fg);font-weight:700;
  box-shadow:0 0 6px rgba(var(--accent-rgb),.6), 0 0 16px rgba(var(--accent-rgb),.3);
}
.period-chip.active:hover{
  background:var(--surface-hover);
  box-shadow:0 0 8px rgba(var(--accent-rgb),.75), 0 0 20px rgba(var(--accent-rgb),.4);
}
.period-summary{
  margin-left:auto;font-size:11px;color:var(--ink-page-muted);
  letter-spacing:.5px;flex-shrink:0;
}
.period-summary strong{color:var(--ink-page);font-weight:600;}

/* MAIN */
main{padding-top:0;}   /* a pilha sticky já ocupa o espaço */
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadeInPanel .18s ease both;}
@keyframes fadeInPanel{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* CAPA */
.capa-wrap{
  min-height:calc(100vh - 152px);
  display:flex;align-items:center;
  padding:64px 56px;position:relative;overflow:hidden;
}
.capa-bg{position:absolute;inset:0;pointer-events:none;}
.capa-bg svg{width:100%;height:100%;display:block;}
.capa-inner{position:relative;z-index:1;max-width:820px;width:100%;}
.capa-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:50px;
  border:1px solid var(--rule-page);
  font-size:9.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--ink-page-muted);margin-bottom:28px;
}
.capa-h1{
  font-size:clamp(52px,7.5vw,96px);font-weight:700;
  line-height:1.0;letter-spacing:-3px;
  color:var(--ink-page);margin-bottom:20px;
}
.capa-h1 u{
  text-decoration:underline;text-decoration-thickness:3px;
  text-underline-offset:8px;text-decoration-color:var(--accent-page);
}
.capa-lead{
  font-size:15px;font-weight:400;line-height:1.65;
  color:var(--ink-page-muted);max-width:580px;margin-bottom:52px;
}
.capa-stats{display:flex;gap:0;flex-wrap:wrap;}
.capa-stat{
  padding:0 32px 0 0;margin-right:32px;
  border-right:1px solid var(--rule-page);
}
.capa-stat:last-child{border-right:none;padding-right:0;margin-right:0;}
.cs-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-page-muted);margin-bottom:5px;}
.cs-value{font-size:15px;font-weight:600;color:var(--ink-page);}

/* RESUMO EXECUTIVO NA CAPA */
.exec-wrap{margin-top:52px;width:100%;}
.exec-semaforo{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap;}
.exec-sem-card{
  flex:1;min-width:120px;
  border-radius:10px;padding:16px 20px;
  display:flex;flex-direction:column;gap:4px;
}
.exec-sem-card.verde{background:rgba(47,143,110,.20);border:1px solid rgba(47,143,110,.6);}
.exec-sem-card.amarelo{background:rgba(197,139,42,.20);border:1px solid rgba(197,139,42,.6);}
.exec-sem-card.vermelho{background:rgba(179,58,58,.20);border:1px solid rgba(179,58,58,.6);}
.exec-sem-num{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1;}
.exec-sem-card.verde .exec-sem-num{color:var(--ok-page);}
.exec-sem-card.amarelo .exec-sem-num{color:var(--warn-page);}
.exec-sem-card.vermelho .exec-sem-num{color:var(--bad-page);}
.exec-sem-lbl{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-page-muted);}
.exec-listas{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.exec-listas{grid-template-columns:1fr;}}
.exec-lista{background:var(--surface-lista);border:1px solid rgba(var(--fg-rgb),.16);border-radius:10px;padding:18px 20px;}
.exec-lista-titulo{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-page-muted);margin-bottom:12px;}
.exec-lista .exec-lista-titulo{color:var(--text-muted);}
.exec-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(var(--fg-rgb),.06);}
.exec-item:last-child{border-bottom:none;}
.exec-item-nome{font-size:11px;font-weight:500;color:var(--fg);flex:1;line-height:1.3;}
.exec-item-area{font-size:9px;color:var(--text-muted);margin-top:1px;}
.exec-item-val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:12px;white-space:nowrap;}
.exec-item-val.verde{color:var(--success);}
.exec-item-val.vermelho{color:var(--danger);}
.exec-periodo{font-size:10px;color:var(--ink-page-muted);margin-bottom:20px;letter-spacing:.5px;}
.exec-periodo strong{color:var(--accent-page);}

/* ÁREA */
.area-wrap{padding:44px 40px 80px;}

/* RESUMO DA ABA + FILTRO POR SINALEIRA */
.aba-resumo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 26px;}
.ar-card{
  display:flex;align-items:center;gap:9px;
  padding:9px 15px;border-radius:9px;cursor:pointer;
  background:var(--bg-card);border:1px solid var(--border-dark);
  font-family:inherit;color:var(--ink-page);
  transition:border-color .2s,background .2s,opacity .2s;
}
.ar-card:hover{background:var(--surface-hover);}
.ar-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.ar-num{font-size:16px;font-weight:700;line-height:1;}
.ar-lbl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-page-muted);}
.ar-card.verde .ar-dot{background:var(--ok-page);box-shadow:0 0 7px var(--ok-page);}
.ar-card.amarelo .ar-dot{background:var(--warn-page);box-shadow:0 0 7px var(--warn-page);}
.ar-card.vermelho .ar-dot{background:var(--bad-page);box-shadow:0 0 7px var(--bad-page);}
.ar-card.sem .ar-dot{background:rgba(var(--fg-rgb),.25);}
.ar-card.verde.ativo{border-color:var(--ok-page);background:rgba(47,143,110,.18);}
.ar-card.amarelo.ativo{border-color:var(--warn-page);background:rgba(197,139,42,.18);}
.ar-card.vermelho.ativo{border-color:var(--bad-page);background:rgba(179,58,58,.18);}
.ar-card.sem.ativo{border-color:var(--ink-page-muted);background:rgba(var(--fg-rgb),.08);}
.ar-card.zero{opacity:.38;cursor:default;}
.ar-limpar{
  background:none;border:1px solid var(--rule-page);border-radius:50px;
  padding:7px 14px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-page-muted);cursor:pointer;font-family:inherit;
}
.ar-limpar:hover{color:var(--ink-page);border-color:var(--accent-page);}
.ar-vazio{padding:44px 0;text-align:center;color:var(--ink-page-muted);font-size:13px;}
.area-head{margin-bottom:36px;}
.area-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 13px;border-radius:50px;
  border:1px solid var(--rule-page);
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink-page-muted);margin-bottom:12px;
}
.area-h2{
  font-size:clamp(28px,3.5vw,48px);font-weight:700;
  letter-spacing:-1.5px;line-height:1.05;
  color:var(--ink-page);margin-bottom:8px;
}
.area-h2 u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent-page);}
.area-sub{font-size:11px;color:var(--ink-page-muted);}
.area-sub strong{color:var(--accent-page);font-weight:600;}
.np-div{height:1px;background:var(--rule-page);margin:28px 0;border:none;}

/* GRID */
.ind-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}
@media(max-width:900px){.ind-grid{grid-template-columns:1fr;}}

/* CARD */
.ind-card{
  background:var(--surface);
  border:1px solid rgba(var(--fg-rgb),.18);
  border-radius:10px;padding:24px;
  display:flex;flex-direction:column;gap:14px;
  transition:border-color .25s,background .25s,transform .25s,box-shadow .25s;
  cursor:pointer;
  min-height:260px;
  min-width:0;
  box-shadow:0 2px 12px rgba(1,30,60,.4);
}
.ind-card:hover{
  border-color:rgba(var(--fg-rgb),.35);
  background:var(--surface-hover);
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(1,30,60,.6);
}
.ind-card.expanded{
  grid-column: span 2;
  border-color:rgba(var(--accent-rgb),.5);
  background:var(--surface-exp);
  box-shadow:0 12px 48px rgba(1,30,60,.8);
  max-width:100%;
}
.ind-card.expanded::after{
  content:'✕ recolher';
  display:block;
  font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(var(--fg-rgb),.35);
  text-align:right;
  margin-top:4px;
}
.ind-card.expanded .ic-chart{ height:250px; max-height:250px; }
.ind-card.expanded .ic-value{ font-size:52px; }
.ind-card.expanded .ic-label{ font-size:11px; }
@media(max-width:900px){.ind-card.expanded{grid-column:span 1;}}

.ic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ic-label{
  font-size:10px;font-weight:700;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--text-muted);
  line-height:1.5;flex:1;
}
.cons-badge{
  font-size:8px;font-weight:700;letter-spacing:1.2px;
  color:rgba(var(--fg-rgb),.45);
  border:1px solid rgba(var(--fg-rgb),.18);
  border-radius:4px;padding:1px 5px;
  cursor:help;
}
.semaforo{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px;background:rgba(var(--fg-rgb),.12);transition:all .3s;}
.semaforo.verde{background:var(--success);box-shadow:0 0 8px var(--success);}
.semaforo.amarelo{background:var(--warning);box-shadow:0 0 8px var(--warning);}
.semaforo.vermelho{background:var(--danger);box-shadow:0 0 8px var(--danger);}

.ic-value{
  font-size:38px;font-weight:700;letter-spacing:-1.5px;
  line-height:1.05;color:var(--fg);
  font-variant-numeric:tabular-nums;
  word-break:break-all;overflow-wrap:anywhere;
}
.ic-value.vazio{font-size:14px;color:var(--text-muted);font-weight:400;font-style:italic;letter-spacing:0;}

/* Comparação de 2 meses selecionados — valor duplo + média (checkpoint v40→v41) */
.ic-value-dual{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.ic-dual-left{min-width:0;flex:1;}
.ic-dual-nums{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;}
.ic-dual-prev{font-size:15px;font-weight:600;color:var(--text-muted);}
.ic-dual-prev.vazio{font-style:italic;}
.ic-dual-arrow{font-size:13px;color:var(--text-muted);}
.ic-dual-cur{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.05;color:var(--fg);word-break:break-all;overflow-wrap:anywhere;}
.ic-dual-cur.vazio{color:var(--text-muted);font-weight:400;font-style:italic;}
.ic-dual-sub{font-size:12.5px;color:var(--text-muted);margin-top:5px;letter-spacing:.2px;}
.ic-dual-delta{font-weight:700;}

// Índices de coluna (0-based) dentro do intervalo lido pela API:
// 0 ÁREA · 1 INDICADOR · 2 TIPO · 3 META · 4..15 Jan..Dez · 16 CONSOLIDADO ANO
const CSV_COL = { area:0, ind:1, tipo:2, meta:3, jan:4, dez:15, cons:16 };

function parseNum(raw){
  if(raw===null || raw===undefined) return null;
  if(typeof raw==='number') return isFinite(raw) ? raw : null;   // v66: valor real vindo da API (UNFORMATTED_VALUE)
  let s = String(raw).trim();
  if(s==='' || s==='—' || s==='-' || s==='#N/A') return null;
  s = s.replace(/R\$/gi,'').replace(/%/g,'').replace(/\s/g,'');
  if(s==='') return null;
  const temV = s.includes(','), temP = s.includes('.');
  if(temV && temP){          // 1.234,56 (pt-BR) → tira ponto de milhar, vírgula vira ponto
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(temV){           // 1234,56 → vírgula decimal
    s = s.replace(',', '.');
  } else if(temP && /^-?\d{1,3}(\.\d{3})+$/.test(s)){
    // 1.000 / 4.000 / 1.234.567 → ponto é separador de MILHAR, não decimal
    s = s.replace(/\./g,'');
  } // demais casos com ponto: decimal, já está ok
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Converte a matriz de linhas devolvida pela API (data.values) no mesmo formato usado no restante do app
// v66: meses e consolidado vêm do valor real; a META e as células com "%" seguem do formatado (escala que o painel já usa).
function mesclarValoresReais(rows, raw){
  rows.forEach((r,i)=>{ const q=raw[i]; if(!q) return;
    for(let c=CSV_COL.jan; c<=CSV_COL.cons; c++){
      const f=r[c], v=q[c];
      if(typeof v==='number' && !(typeof f==='string' && f.indexOf('%')>=0)) r[c]=v;
    } });
}
function rowsToData(rows){
  const data = {};
  rows.forEach(r=>{
    const ind = (r[CSV_COL.ind]||'').trim();
    if(!ind || ind.toUpperCase()==='INDICADOR') return; // pula cabeçalho e seções
    const meses=[];
    for(let c=CSV_COL.jan;c<=CSV_COL.dez;c++) meses.push(parseNum(r[c]));
    data[slug(ind)] = {
      nome: ind,
      tipo: (r[CSV_COL.tipo]||'').trim(),
      meta: parseNum(r[CSV_COL.meta]),
      meses: meses,
      cons: parseNum(r[CSV_COL.cons])
    };
  });
  return data;
}

async function fetchSheet(){
  ST.loading=true; ST.error=null; if(appEntered) renderMain();
  try{
    if(!ACCESS_TOKEN) throw new Error('Sem token de acesso — o login não chegou a concluir.');
    const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID +
                '/values/' + encodeURIComponent(RANGE) + '?t=' + Date.now();
    // v66: lê duas vezes — formatado (para a META, ex.: "85%") e valor real (meses e consolidado, sem o arredondamento da célula)
    const [res, resRaw] = await Promise.all([
      fetch(url, { headers:{ 'Authorization':'Bearer ' + ACCESS_TOKEN }, cache:'no-store' }),
      fetch(url + '&valueRenderOption=UNFORMATTED_VALUE', { headers:{ 'Authorization':'Bearer ' + ACCESS_TOKEN }, cache:'no-store' })
    ]);
    if(res.status===401){
      // Token expirado: renova silenciosamente; onTokenResponse chama fetchSheet() de novo ao concluir
      ST.loading=false;
      ST.error='Sessão expirada, renovando...';
      if(appEntered) renderMain();
      if(tokenClient) tokenClient.requestAccessToken({ prompt:'' });
      return;
    }
    if(!res.ok){
      let detalhe = 'HTTP '+res.status;
      try{
        const errJson = await res.json();
        if(errJson && errJson.error && errJson.error.message) detalhe += ' — ' + errJson.error.message;
        if(errJson && errJson.error && errJson.error.status) detalhe += ' ('+errJson.error.status+')';
      }catch(_e){ /* corpo do erro não era JSON, segue só com o status */ }
      throw new Error(detalhe);
    }
    const json = await res.json();
    const rows = json.values || [];
    try{ if(resRaw && resRaw.ok){ const raw=((await resRaw.json()).values)||[]; mesclarValoresReais(rows, raw); } }catch(_e){ /* sem o valor real, segue com o formatado */ }
    const data = rowsToData(rows);
    if(Object.keys(data).length===0) throw new Error('A API respondeu OK, mas a planilha voltou com 0 linhas na aba/intervalo configurado.');
    ST.data = data; ST.loading=false; ST.error=null;
    ajustarMesAutomatico();   // abre no último mês com dado real, não no mês do calendário
  }catch(e){
    ST.loading=false;
    const msg = (e && e.message) ? e.message : String(e);
    ST.error = 'Não foi possível ler o Painel. Detalhe técnico: ' + msg;
  }
  ST.lastUpdate=new Date(); updateRefreshTs();
  if(appEntered){
    renderMain();
    if(_refreshTimer) clearTimeout(_refreshTimer);
    _refreshTimer = setTimeout(fetchSheet, REFRESH_MS);
  }
}

function calcTrend(d, inv){
  if(!d) return null;
  const vals = d.meses.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  if(vals.length < 2) return null;
  const last3 = vals.slice(-3);
  const n = last3.length;
  const sumX = last3.reduce((s,x)=>s+x.i,0);
  const sumY = last3.reduce((s,x)=>s+x.v,0);
  const sumXY = last3.reduce((s,x)=>s+x.i*x.v,0);
  const sumX2 = last3.reduce((s,x)=>s+x.i*x.i,0);
  const denom = n*sumX2 - sumX*sumX;
  if(denom===0) return 'flat';
  const slope = (n*sumXY - sumX*sumY) / denom;
  const threshold = Math.abs(sumY/n) * 0.005;
  if(Math.abs(slope) < threshold) return 'flat';
  if(inv) return slope < 0 ? 'up' : 'down';
  return slope > 0 ? 'up' : 'down';
}

function updateChips(){
  const sel = ST.selectedMonths;

  // Chips de mês
  document.querySelectorAll('[data-mi]').forEach(b => {

    b.classList.toggle('active', sel.includes(i));

      b.classList.toggle('active', sel.length === 12);
    } else {
      const match = r.idxs.length === sel.length && r.idxs.every(i => sel.includes(i));
      b.classList.toggle('active', match);
    }
  });

  // Label no header e no summary
  let lbl;
  if(sel.length === 1){
    lbl = MESES[sel[0]];
  } else if(ehPeriodoCompleto(sel)){
    lbl = 'Período completo';
  } else if(sel.length === 12){
    lbl = 'Ano completo';
  } else {
    const idxs = [...sel].sort((a,b)=>a-b);
    // Verifica se é contíguo
    const contiguo = idxs.every((v,i) => i===0 || v===idxs[i-1]+1);
    lbl = contiguo ? MESES[idxs[0]] + ' – ' + MESES[idxs[idxs.length-1]] : sel.length + ' meses';
  }

  const topEl = document.getElementById('topPeriodo');
  if(topEl) topEl.textContent = lbl;

  const areaAtual = ST.tab==='capa' ? 'AHCROS' : (AREAS.find(a=>a.id===ST.tab)||{label:'AHCROS'}).label;
  document.title = 'AHCROS · ' + areaAtual + ' · ' + lbl;

  }
}

// ---- Mês padrão automático: último mês com lançamento real ----
// Global quando na capa; por aba quando a aba ativa não tem nada no mês corrente.
// Qualquer clique do usuário em chip de período desliga o automático (ST.mesManual).
function ultimoMesComDado(areaId){
  if(!ST.data) return null;
  let ids = null;
  if(areaId && areaId !== 'capa'){
    const a = AREAS.find(x => x.id === areaId);
    if(a) ids = a.indicadores.map(i => i.id);
  }
  // conta quantos indicadores têm valor em cada mês
  const cont = new Array(12).fill(0);
  Object.keys(ST.data).forEach(k => {
    if(ids && ids.indexOf(k) < 0) return;
    const ms = ST.data[k].meses || [];
    for(let i = 0; i < 12; i++){
      if(ms[i] !== null && ms[i] !== undefined && !isNaN(ms[i])) cont[i]++;
    }
  });
  const max = Math.max.apply(null, cont);
  if(max === 0) return null;
  // limiar: um mês só conta como "mês com lançamento" se tiver ao menos 20% do
  // melhor mês. Sem isso, uma célula solta em dezembro joga o painel inteiro para lá.
  const limiar = Math.max(1, Math.ceil(max * 0.2));
  for(let i = 11; i >= 0; i--) if(cont[i] >= limiar) return i;
  return null;
}

// PERÍODO COMPLETO — todos os meses que já têm lançamento. Substituiu "Ano completo" e
// "Últimos 3 meses" (v49): enquanto a planilha tem 3 meses, comparar com um trimestre
// anterior que não existe só produz travessão.
// Prioriza a aba ativa; cai para o global quando a aba não tem nada.
function mesesLancados(areaId){
  if(!ST.data) return null;
  let ids = null;
  if(areaId && areaId !== 'capa'){
    const a = AREAS.find(x => x.id === areaId);
    if(a) ids = a.indicadores.map(i => i.id);
  }
  const cont = new Array(12).fill(0);
  Object.keys(ST.data).forEach(k => {
    if(ids && ids.indexOf(k) < 0) return;
    const ms = ST.data[k].meses || [];
    for(let i = 0; i < 12; i++){
      if(ms[i] !== null && ms[i] !== undefined && !isNaN(ms[i])) cont[i]++;
    }
  });
  const max = Math.max.apply(null, cont);
  if(max === 0) return null;
  // mesmo limiar de 20% do ultimoMesComDado: uma célula solta não vira "mês lançado"
  const limiar = Math.max(1, Math.ceil(max * 0.2));
  const out = [];
  for(let i = 0; i < 12; i++) if(cont[i] >= limiar) out.push(i);
  return out.length ? out : null;
}

function periodoCompleto(){
  let out = null;
  if(ST.tab && ST.tab !== 'capa') out = mesesLancados(ST.tab);
  if(!out) out = mesesLancados(null);
  return out;
}

function ehPeriodoCompleto(sel){
  const pc = periodoCompleto();
  if(!pc || !sel || pc.length !== sel.length) return false;
  return pc.every(i => sel.includes(i));
}

// A seleção cobre TODOS os meses lançados DESTE indicador? Só então o card pode usar o
// CONSOLIDADO da central (coluna Q), que traz o regime certo definido na planilha da área
// (soma, média, último, ou soma dos numeradores ÷ soma dos denominadores). Fora disso, o
// card faz média simples dos meses — e diz "média" no rótulo, para não passar por oficial.
function cobreTudo(d, sel){
  if(!d || !d.meses || !sel) return false;
  let algum = false;
  for(let i = 0; i < 12; i++){
    const v = d.meses[i];
    if(v === null || v === undefined || isNaN(v)) continue;
    algum = true;
    if(sel.indexOf(i) < 0) return false;
  }
  return algum;
}

function corDelta(dt){
  return (dt.better===null || (dt.pct!==null && Math.abs(dt.pct)<=5))
    ? 'var(--warning)'
    : (dt.better ? 'var(--success)' : 'var(--danger)');
}

  const pc = periodoCompleto();

  ST.selectedMonths = pc.slice();

  }
  // RESUMO DA ABA — contagem por sinaleira no período selecionado.
  // A cor usada aqui é exatamente a mesma que o card calcula (semCls do valor do período).
  const cont = {verde:0, amarelo:0, vermelho:0, sem:0};
  const comCor = area.indicadores.map(ind=>{
    const d  = getData(ind);
    const sc = leitura(ind,sel).sc;
    cont[sc]++;
    return {ind, sc};
  });

  const f = ST.filtroCor;
  const visiveis = f ? comCor.filter(x=>x.sc===f) : comCor;

  const AR_LBL = {verde:'No alvo', amarelo:'Atenção', vermelho:'Crítico', sem:'Sem leitura'};
  function arCard(cor){
    const num = cont[cor];
    const cls = 'ar-card ' + cor + (f===cor?' ativo':'') + (num===0?' zero':'');
    const oc  = num===0 ? '' : ` onclick="setFiltroCor('${cor}')"`;
    const tip = num===0 ? 'Nenhum indicador nesta faixa neste período'
              : (f===cor ? 'Clique para limpar o filtro' : 'Clique para ver só estes');
    return `<button type="button" class="${cls}" title="${tip}"${oc}><span class="ar-dot"></span><span class="ar-num">${num}</span><span class="ar-lbl">${AR_LBL[cor]}</span></button>`;
  }

  const resumoH = `<div class="aba-resumo">
  ${arCard('verde')}${arCard('amarelo')}${arCard('vermelho')}${arCard('sem')}
  ${f ? `<button type="button" class="ar-limpar" onclick="setFiltroCor(null)">✕ Limpar filtro · mostrando ${visiveis.length} de ${comCor.length}</button>` : ''}
</div>`;

  let h=`<div class="tab-panel active"><section class="area-wrap">
<div class="area-head">
  <div class="area-pill">${area.num} &nbsp;·&nbsp; Área</div>
  <h2 class="area-h2"><u>${area.label}</u></h2>
  <div class="area-sub">Responsável: <strong>${area.responsavel}</strong> &nbsp;·&nbsp; Período: <strong>${lbl}</strong></div>
</div>
${resumoH}
<hr class="np-div">`;
  if(visiveis.length === 0){
    h += `<div class="ar-vazio">Nenhum indicador nesta faixa no período selecionado.</div>`;
  } else {
    h += `<div class="ind-grid" id="indGrid_${area.id}">`;
    visiveis.forEach(x=>{ h+=htmlCard(x.ind); });
    h += `</div>`;
  }
  h+=`</section></div>`;
  return h;
}

// CARD
// v61 — Indicadores de ESTOQUE (acumulados): o valor do período é a posição do último mês lançado,
// não média nem soma. Metadado fora do AREAS, por rótulo. Meta segue mensal (não acumula).
const V61_ESTOQUE = new Set(['% Projetos aprovados (%)','Nº Projetos Aprovados','Nº Projetos Submetidos',
  '% Colaboradores treinados LGPD (%)','Nº Especialidades Médicas Ativas'].map(r=>slug(r)));
function getData(ind){
  if(!ST.data) return null;
  const d = ST.data[ind.id] || ST.data[slug(ind.label)] || null;
  if(d && d._estoque===undefined) d._estoque = typeof V61_ESTOQUE!=='undefined' && V61_ESTOQUE.has(slug(ind.label));
  return d;
}

// v64 — regra única de casas (decisão 01/10): uma casa; inteiro ou zero sem casa;
// duas casas só quando uma casa mostraria "0,0" para algo que não é zero.
function fmtNum(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const r1=Math.round(v*10)/10;
  if(Math.abs(r1)<1e-9){ if(Math.abs(v)<1e-9) return '0'; return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  const dec=Math.abs(r1-Math.round(r1))<1e-9?0:1;
  return r1.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
// NPS é escala de pontos (−100 a 100): a variação sai em pontos, nunca em %.
function ehNPS(ind){ return /^NPS\b/i.test((ind&&ind.label)||''); }
// Último mês com lançamento do indicador (para o aviso quando o mês selecionado está vazio).
function ultLanc(d){ if(!d) return null; for(let i=11;i>=0;i--){ const v=d.meses[i]; if(v!==null&&v!==undefined&&!isNaN(v)) return i; } return null; }
// v64: meta/limite com duas casas na planilha aparece com duas casas (ex.: limite 0,15%), exceção à regra de uma casa.
function fmtMeta(v,ind){
  if(v===null||v===undefined||isNaN(v)) return null;
  if(!ind.moeda && Math.abs(v*100-Math.round(v*100))<1e-6 && Math.abs(v*10-Math.round(v*10))>1e-6){
    const s=v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return ind.tipo==='Taxa/%' ? s+'%' : s;
  }
  return fmtVal(v,ind);
}
function fmtVal(v,ind){
  if(v===null||v===undefined) return null;
  if(ind.tipo==='Taxa/%') return fmtNum(v)+'%';
  if(ind.moeda){
    const abs=Math.abs(v), neg=v<0;
    const pf=neg?'−R$ ':'R$ ';
    if(abs>=1e6) return pf+fmtNum(abs/1e6)+'mi';      // v64: regra única de casas também no mil/mi
    if(abs>=1e3) return pf+fmtNum(abs/1e3)+'mil';
    return pf+abs.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  if(/vidas [úÚ]nicas/i.test(ind.label||'')) return Math.round(v).toLocaleString('pt-BR');  // pessoas: média do período em inteiro
  return fmtNum(v);
}

// Rótulo curto pro eixo Y — casas decimais vêm do passo da escala (ver niceScale), nunca fixo
function fmtAxisTick(v, ind, decimals){
  decimals = decimals||0;
  if(ind.tipo==='Taxa/%') return v.toLocaleString('pt-BR',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})+'%';
  if(ind.moeda){
    const abs=Math.abs(v);
    if(abs>=1e6) return (v/1e6).toFixed(1).replace('.',',')+'mi';
    if(abs>=1e3) return (v/1e3).toFixed(0)+'mil';
    return v.toLocaleString('pt-BR',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  }
  return v.toLocaleString('pt-BR',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

// "Nice numbers" (Heckbert): garante passo/min/max redondos — nunca deixa o eixo cair em
// números quebrados tipo 0/18,3/36,7/55 nem em passos tão pequenos que arredondam repetido.
function niceNum(range, round){
  if(range<=0) return 1;
  const exp = Math.floor(Math.log10(range));
  const frac = range / Math.pow(10, exp);
  let niceFrac;
  if(round){
    if(frac<1.5) niceFrac=1; else if(frac<3) niceFrac=2; else if(frac<7) niceFrac=5; else niceFrac=10;
  } else {
    if(frac<=1) niceFrac=1; else if(frac<=2) niceFrac=2; else if(frac<=5) niceFrac=5; else niceFrac=10;
  }
  return niceFrac * Math.pow(10, exp);
}
function niceScale(lo, hi, maxTicks, isCount){
  if(hi<=lo) hi = lo + 1;
  const range = niceNum(hi-lo, false);
  let step = niceNum(range/(maxTicks-1), true);
  if(isCount && step<1) step = 1;   // contagem (Nº de X) não tem passo fracionário
  const niceMin = Math.floor(lo/step)*step;
  const niceMax = Math.ceil(hi/step)*step;
  const decimals = step>=1 ? 0 : Math.max(0, -Math.floor(Math.log10(step)));
  return { min:niceMin, max:niceMax, step, decimals };
}

function semCls(v,meta,inv){
  if(v===null||meta===null) return '';
  if(inv){
    if(v<=meta) return 'verde';
    return ((v-meta)/Math.abs(meta)*100)<=5?'amarelo':'vermelho';
  } else {
    if(v>=meta) return 'verde';
    return ((meta-v)/Math.abs(meta)*100)<=5?'amarelo':'vermelho';
  }
}

// Quantos meses do ano têm lançamento real neste indicador.
function mesesComDado(d){
  if(!d || !d.meses) return 0;
  let n = 0;
  for(let i=0;i<12;i++){ const v=d.meses[i]; if(v!==null && v!==undefined && !isNaN(v)) n++; }
  return n;
}

// META EFETIVA DO PERÍODO.
// O CONSOLIDADO ANO da central SOMA os Valor/Qtd e faz MÉDIA dos Taxa/%. Em "Ano completo",
// portanto, o valor de um Valor/Qtd é a soma de N meses — e compará-lo com a meta MENSAL
// infla o desvio (7 meses de tempo de espera contra o limite de um mês vira "+618%").
// Aqui a meta é acumulada pelo mesmo N. Isso equivale a comparar a MÉDIA do período com a
// meta mensal, que é a leitura certa tanto para contagem (volume, admissões) quanto para
// média/tempo/custo unitário (espera, satisfação, ticket).
// Em seleções de 1 a 11 meses o card já usa a média dos meses, então a meta segue mensal.
// A linha tracejada do gráfico continua sendo a meta MENSAL — o gráfico é mês a mês.
function metaEfetiva(ind, d, sel){
  if(!d || d.meta===null || d.meta===undefined) return null;
  if(d._estoque) return d.meta;                    // estoque: compara a posição com a meta, sem acumular
  if(!sel || !cobreTudo(d,sel)) return d.meta;
  if(ind.tipo==='Taxa/%') return d.meta;          // consolidado de % já é média
  const n = mesesComDado(d);
  if(n<=1 || d.cons===null || d.cons===undefined || isNaN(d.cons)) return d.meta;

  // Em vez de PRESUMIR que todo Valor/Qtd soma, o dashboard olha o consolidado que a central
  // devolveu e descobre o regime: se ele bate com a SOMA dos meses, a meta é acumulada; se bate
  // com a MÉDIA — ou com um recálculo do agregado, que fica na mesma escala mensal — a meta
  // segue mensal. Assim, quando a fórmula de um indicador for corrigida na central (média em vez
  // de soma, ou soma dos numeradores ÷ soma dos denominadores), o card passa a ler certo sozinho,
  // sem precisar de uma segunda rodada de código nem de uma marca por indicador.
  let soma = 0;
  for(let i=0;i<12;i++){ const v=d.meses[i]; if(v!==null && v!==undefined && !isNaN(v)) soma+=v; }
  const media = soma/n;
  return Math.abs(d.cons-soma) < Math.abs(d.cons-media) ? d.meta*n : d.meta;
}

function calcAtt(cur, meta){
  // % em relação à referência (meta OU limite). Sempre real/referência.
  // Meta: >=100% = atingiu/superou (bom). Limite: <=100% = dentro do teto (bom).
  if(cur===null||cur===undefined||meta===null||meta===0) return null;
  return (cur/meta)*100;
}

// v67: mês em foco = último mês da seleção com lançamento neste indicador. Sinaleira, barra de meta,
// Resumo e blocos julgam esse mês contra a meta mensal; o consolidado do período fica como contexto.
function focoMes(d, sel){
  if(!d||!d.meses) return null;
  const s=(!sel||!sel.length)?[...Array(12).keys()]:sel;
  for(let k=s.length-1;k>=0;k--){ const v=d.meses[s[k]]; if(v!==null&&v!==undefined&&!isNaN(v)) return s[k]; }
  return null;
}
function selFoco(d, sel){ const m=focoMes(d,sel); return m===null ? sel : [m]; }
function selGrupo(ents, sel){
  let mx=null; ents.forEach(e=>{ const m=focoMes(getData(e.ind),sel); if(m!==null&&(mx===null||m>mx)) mx=m; });
  return mx===null ? sel : [mx];
}
function lblFoco(ms, sel){
  const v=(ms||[]).filter(m=>m!==null&&m!==undefined); if(!v.length) return periodoLbl(sel);
  const cnt={}; v.forEach(m=>{ cnt[m]=(cnt[m]||0)+1; });
  const dom=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b-a)[0];
  const outros=v.filter(m=>m!==dom).length;
  return MESES[dom]+(outros?` (${outros} ${outros>1?'indicadores':'indicador'} com último lançamento em outro mês)`:'');
}
function calcCurVal(d, sel){
  if(!d) return null;
  if(d._estoque){ const s=(!sel||!sel.length)?[...Array(12).keys()]:sel;
    const u=[...s].reverse().find(i=>d.meses[i]!==null&&d.meses[i]!==undefined&&!isNaN(d.meses[i]));
    return u===undefined?null:d.meses[u]; }
  if(!sel || sel.length===12) return d.cons;
  if(sel.length===1) return d.meses[sel[0]];
  // Seleção cobrindo tudo que está lançado → CONSOLIDADO da central, não média do navegador.
  if(cobreTudo(d,sel) && d.cons!==null && d.cons!==undefined && !isNaN(d.cons)) return d.cons;
  const vals = sel.map(i=>d.meses[i]).filter(v=>v!==null && v!==undefined && !isNaN(v));
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

// Variação entre dois pontos. Quando a base é ZERO, variação percentual não existe
// (divisão por zero) — devolve a diferença ABSOLUTA: p.p. para Taxa/%, valor bruto p/ o resto.
function deltaTxt(prevV, curV, ind){
  if(prevV===null||prevV===undefined||isNaN(prevV)) return null;
  if(curV===null||curV===undefined||isNaN(curV)) return null;
  const diff = curV - prevV;
  const arrow = diff>0?'▲':(diff<0?'▼':'—');
  const better = ind.invertido ? diff<0 : diff>0;
  if(diff===0) return {arrow:'—', txt:'estável', better:null, zeroBase:prevV===0, pct:0, diff:0};
  if(ehNPS(ind)) return {arrow, txt:fmtNum(Math.abs(diff))+(Math.abs(diff)===1?' ponto':' pontos'), better, zeroBase:prevV===0, pct:null, diff};
  if(prevV===0){
    const txt = ind.tipo==='Taxa/%'
      ? fmtNum(Math.abs(diff))+' p.p.'
      : fmtVal(Math.abs(diff), ind);
    return {arrow, txt, better, zeroBase:true, pct:null, diff};
  }
  const m=(diff/Math.abs(prevV))*100;
  const rel = fmtNum(Math.abs(m))+'%';
  // Taxa/%: a variação vai em PONTOS PERCENTUAIS, com a relativa entre parênteses (v50).
  // 0,3% → 0,1% é "0,2 p.p. (66,7%)": só a relativa soaria como queda de dois terços.
  const txt = ind.tipo==='Taxa/%'
    ? fmtNum(Math.abs(diff))+' p.p. ('+rel+')'
    : rel;
  return {arrow, txt, better, zeroBase:false, pct:m, diff};
}

// Meses consecutivos em zero, olhando para trás a partir de ateIdx (ignora meses sem lançamento).
// Meses consecutivos COM ocorrência (>0), olhando para trás a partir de ateIdx (ignora meses sem lançamento).
function streakPos(d, ateIdx){
  let n=0;
  for(let i=ateIdx;i>=0;i--){ const v=d.meses[i]; if(v===null||v===undefined||isNaN(v)) continue; if(v>0) n++; else break; }
  return n;
}
function streakZero(d, ateIdx){
  let n=0;
  for(let i=ateIdx;i>=0;i--){
    const v=d.meses[i];
    if(v===null||v===undefined||isNaN(v)) continue;
    if(v===0) n++; else break;
  }
  return n;
}

// v67b: uma linha de atingimento (rótulo, % da meta/limite, barra, real × referência)
function v67Goal(ind, cur, meta, rot, metaNota){
  const isLimite = ind.invertido, refLbl = isLimite ? 'Limite' : 'Meta';
  const semDado = (cur===null||cur===undefined||isNaN(cur));
  const vF = semDado ? null : fmtVal(cur, ind);
  const metaD = (fmtMeta(meta,ind)||String(meta)) + (metaNota ? ` <span style="opacity:.6;font-weight:400">(${metaNota})</span>` : '');
  const foot = `<div class="ic-goal-foot"><span>Real: <strong>${vF||'&mdash;'}</strong></span><span>${refLbl}: <strong>${metaD}</strong></span></div>`;
  const topo = (cls,txt,tip)=>`<div class="ic-goal-top"><span class="ic-goal-lbl">${rot}</span><span class="ic-goal-pct ${cls}"${tip?` title="${tip}"`:''}>${txt}</span></div>`;
  if(meta===0){
    const dentro = !semDado && (isLimite ? cur<=0 : cur>=0);
    const clsZ = semDado ? 'neu' : (dentro ? 'verde' : 'vermelho');
    const txtZ = semDado ? '&mdash;' : (dentro ? 'Sem ocorrências' : 'Acima do limite zero');
    return `<div class="ic-goal">${topo(clsZ,txtZ,'Limite zero: não há percentual a calcular')}<div class="ic-goal-track">${semDado?'':`<div class="ic-goal-fill ${clsZ}" style="width:100%"></div>`}</div>${foot}</div>`;
  }
  const att = calcAtt(cur, meta);
  if(att===null) return `<div class="ic-goal">${topo('neu','&mdash;')}<div class="ic-goal-track"><div class="ic-goal-mark" style="left:76.9%"></div></div>${foot}</div>`;
  const MAX=130, markPos=100/MAX*100, attV=Math.min(att,MAX), fillBase=Math.min(att,100)/MAX*100;
  const over = attV>100 ? (attV-100)/MAX*100 : 0;
  const cls = semCls(cur,meta,isLimite)||'neu', overCls = isLimite ? 'bad' : 'good';
  const attR = Math.round(att*10)/10;
  const attTxt = isLimite
    ? (attR <= 100 ? fmtNum(att)+'% do limite' : 'Ultrapassou o limite em '+fmtNum(att-100)+'%')
    : (attR >  100 ? 'Superou a meta em '+fmtNum(att-100)+'%' : (attR === 100 ? 'Meta atingida' : fmtNum(att)+'% da meta'));
  return `<div class="ic-goal">${topo(cls,attTxt)}<div class="ic-goal-track">
    <div class="ic-goal-fill ${cls}" style="width:${fillBase}%"></div>
    ${over>0?`<div class="ic-goal-over ${overCls}" style="left:${markPos}%;width:${over}%"></div>`:''}
    <div class="ic-goal-mark" style="left:${markPos}%"></div></div>${foot}</div>`;
}

function htmlCard(ind, titulo){          // v64: titulo = título do LAYOUT, como no destaque
  const d = getData(ind);
  const sel = getMesesSelecionados();
  const realCount = d ? d.meses.filter(v=>v!==null && v!==undefined && !isNaN(v)).length : 0;
  let cur=null, prev=null, meta=null, metaMes=null, perV=null, mF=null;
  if(d){
    metaMes = d.meta;                     // meta mensal — é a do gráfico e da tracejada
    mF = focoMes(d, sel); const sF = mF===null ? sel : [mF];
    meta    = metaEfetiva(ind, d, sF);    // v67: sinaleira e barra julgam o mês em foco contra a meta mensal
    cur = mF===null ? null : calcCurVal(d, sF);
    perV = calcCurVal(d, sel);            // consolidado do período: contexto, à direita
    // prev: mês anterior ao primeiro selecionado (só quando 1 mês)
    if(sel && sel.length===1 && sel[0]>0) prev = d.meses[sel[0]-1];
  }
  const vFmt = cur!==null ? fmtVal(cur,ind) : null;
  const sc = semCls(cur,meta,ind.invertido);
  const trend = d ? calcTrend(d, ind.invertido) : null;
  const trendIcon = trend==='up'?'↗':trend==='down'?'↘':'→';
  const trendH = trend ? `<span class="ic-trend ${trend||'flat'}" title="Tendência 3 meses">${trendIcon}</span>` : '';

  // MoM (só quando 1 mês selecionado)
  let momH = '';
  if(sel && sel.length===1){
    if(cur!==null && prev!==null && prev!==0){
      const m=((cur-prev)/Math.abs(prev))*100;
      const better=ind.invertido?m<0:m>0;
      const cls=better?'pos':(m===0?'neu':'neg');
      const arr=m>0?'▲':(m<0?'▼':'—');
      const dtM=deltaTxt(prev,cur,ind);
      momH=`<div class="ic-delta ${cls}"><span class="dl">MoM</span>${arr} ${dtM?dtM.txt:''}</div>`;
    } else {
      momH='';                                   // v64: sem "MoM—"
    }
  } else if(sel.length===12){
    momH='<div class="ic-delta neu"><span class="dl">Período</span>Ano</div>';
  } else {
    const contig = sel.every((v,i)=>i===0||v===sel[i-1]+1);
    const lbl2 = contig ? MESES[sel[0]]+'–'+MESES[sel[sel.length-1]] : sel.length+' meses';
    const suf = d&&d._estoque ? ' (posição no último mês)' : (d && cobreTudo(d,sel)) ? ' (consolidado)' : ' (média)';
    momH=`<div class="ic-delta neu"><span class="dl">Período</span>${lbl2}${suf}</div>`;
  }

  // v64: sem dado no que foi selecionado → diz o último lançamento (ex.: Faturamento em Ago)
  if(cur===null){ const uL=ultLanc(d); momH = uL!==null ? `<div class="ic-delta neu">Último lançamento: ${MESES[uL]}</div>` : ''; }

  // Bloco de valor duplo — v48: vale para QUALQUER seleção (antes, só com 2 meses).
  //   1 mês  → mês anterior  →  mês selecionado
  //   2 meses→ 1º mês        →  2º mês            (+ média do par à direita)
  //   3+ meses (opção "a")   → média do período anterior de MESMO tamanho → média do período
  //   Ano completo (12)      → mantém o número único + selo ANO (não existe ano anterior na planilha)
  let dualH = '';
  let labelStyleAttr = '';
  if(d && sel && cur !== null){
    const mintStyle = 'color:var(--fg);font-weight:500;';
    labelStyleAttr = ` style="${mintStyle}"`;
    const contiguo = sel.every((v,i)=>i===0||v===sel[i-1]+1);

    // PROGRESSÃO DO PERÍODO (v49): os meses do próprio período, um após o outro, com o
    // último — o mês corrente — em corpo maior. À direita, o consolidado do período.
    let dualNums = '', dualSub = '', avgH = '';

    if(sel.length===1){
      const vEsq   = sel[0]>0 ? d.meses[sel[0]-1] : null;
      const lblEsq = sel[0]>0 ? MESES[sel[0]-1] : '—';
      const eF = fmtVal(vEsq, ind), dF = fmtVal(cur, ind);
      // v64: sem dado no mês anterior, o card não mostra "Mai → Jun" com traço
      const curS = `<span class="ic-dual-cur ${dF?'':'vazio'}">${dF||'&mdash;'}</span>`;
      dualNums = eF ? `<span class="ic-dual-prev">${eF}</span>
        <span class="ic-dual-arrow">→</span>
        ${curS}` : curS;
      const dt1 = deltaTxt(vEsq, cur, ind);
      dualSub = (eF ? `${lblEsq} → ${MESES[sel[0]]}` : MESES[sel[0]]) +
        (dt1 ? ` <span class="ic-dual-delta" style="color:${corDelta(dt1)}">${dt1.arrow} ${dt1.txt}</span>` : '');
    } else {
      // só os meses selecionados QUE TÊM lançamento entram na progressão
      const pts = sel.filter(i => d.meses[i]!==null && d.meses[i]!==undefined && !isNaN(d.meses[i]));
      if(pts.length===0){
        dualNums = `<span class="ic-dual-cur vazio">&mdash;</span>`;
        dualSub  = contiguo ? MESES[sel[0]]+' → '+MESES[sel[sel.length-1]] : sel.length+' meses';
      } else {
        // v66d: o topo mostra só o mês anterior → o último mês, qualquer que seja o tamanho do período.
        //   A série inteira está no gráfico; o consolidado do período fica à direita e a variação do período, no rodapé.
        //   Assim o card tem a mesma largura com 2 ou com 12 meses lançados.
        const vis = pts.slice(-2);
        const partes = vis.map((i,k)=>{
          if(i===null) return `<span class="ic-dual-arrow">…</span>`;
          const f = fmtVal(d.meses[i], ind);
          const cls = (k===vis.length-1) ? 'ic-dual-cur' : 'ic-dual-prev';
          return `<span class="${cls} ${f?'':'vazio'}">${f||'&mdash;'}</span>`;
        });
        dualNums = partes.join('<span class="ic-dual-arrow">→</span>');
        // v50: a variação do topo é do ÚLTIMO mês contra o ANTERIOR do próprio período.
        // A variação do período inteiro ficou no rodapé, para o card não repetir a mesma conta.
        const iAnt = pts.length>=2 ? pts[pts.length-2] : null;
        const dtP = iAnt===null ? null : deltaTxt(d.meses[iAnt], d.meses[pts[pts.length-1]], ind);
        const nomes = vis.map(i=>MESES[i]).join(' → ');
        dualSub = nomes +
          (dtP ? ` <span class="ic-dual-delta" style="color:${corDelta(dtP)}">${dtP.arrow} ${dtP.txt}</span>` : '');
      }
      avgH = `<div class="ic-dual-avg">
      <div class="ic-avg-label" style="${mintStyle}">${d&&d._estoque?'último mês':cobreTudo(d,sel)?'consolidado':'média'}</div>
      <div class="ic-avg-value">${fmtVal(perV,ind)||'&mdash;'}</div>
      <div class="ic-avg-per">${periodoLbl(sel)}</div>
    </div>`;
    }

    dualH = `<div class="ic-value-dual">
    <div class="ic-dual-left">
      <div class="ic-dual-nums">${dualNums}</div>
      <div class="ic-dual-sub">${dualSub}</div>
    </div>
    ${avgH}
  </div>`;
  }

  const metaD    = meta!==null    ? fmtMeta(meta,ind)||String(meta)          : '—';
  const metaMesD = metaMes!==null ? fmtMeta(metaMes,ind)||String(metaMes)    : '—';
  // Quando a meta foi acumulada, o rodapé explica a conta em vez de mostrar um número solto.
  const nAcum = (meta!==null && metaMes!==null && meta!==metaMes) ? Math.round(meta/metaMes) : 1;
  const consTip = d&&d._estoque ? 'Indicador acumulado: o valor do período é a posição do último mês lançado, comparada com a meta' : ind.tipo==='Taxa/%'
    ? 'Consolidado do período: vem da coluna CONSOLIDADO da central (média dos meses lançados)'
    : 'Consolidado do período: vem da coluna CONSOLIDADO da central (soma dos meses lançados) — a meta ao lado foi acumulada pelo mesmo número de meses';
  const metaFootD = nAcum>1
    ? `${metaD} <span style="opacity:.55;font-weight:400">(${metaMesD}/mês × ${nAcum})</span>`
    : metaD;

  // Insight de comparação (apenas 1 mês selecionado, com mês anterior disponível)
  let insightH = '';
  if(meta===0 && d && sel && sel.length){
    // Meta zero: a leitura de evolução é SEQUÊNCIA, não proporção.
    const ult = mF!==null ? mF : sel[sel.length-1];
    const vUlt = d.meses[ult];
    if(vUlt!==null && vUlt!==undefined && !isNaN(vUlt)){
      const cls = vUlt<=0 ? 'verde' : 'vermelho';
      let txt;
      if(vUlt<=0){
        const n = streakZero(d, ult);
        txt = n>1 ? `<strong>${n} meses</strong> seguidos sem ocorrência` : `Sem ocorrência em ${MESES_FULL[ult]}`;
      } else {
        const antes = ult>0 ? streakZero(d, ult-1) : 0;
        const sg = streakPos(d, ult);
        txt = sg>1 ? `<strong>${sg}º mês</strong> seguido com ocorrência` : `Ocorrência registrada em ${MESES_FULL[ult]}`
            + (antes>0 ? `, após <strong>${antes} ${antes>1?'meses':'mês'}</strong> em zero` : '');
      }
      insightH=`<div class="ic-insight ${cls}">${txt}</div>`;
    }
  } else if(sel && sel.length===1 && sel[0]>0 && cur!==null && prev!==null){
    const dt = deltaTxt(prev, cur, ind);
    const mesAtual=MESES_FULL[sel[0]], mesAnt=MESES_FULL[sel[0]-1];
    const cls=sc||'neu';
    let txt;
    if(!dt || dt.diff===0){ txt=`${mesAtual} manteve-se estável vs. ${mesAnt}`; }
    else { txt=`${mesAtual} ${dt.diff>0?'cresceu':'caiu'} <strong>${dt.txt}</strong> vs. ${mesAnt}`; }
    insightH=`<div class="ic-insight ${cls}">${txt}</div>`;
  } else if(false && d && sel && sel.length>=2){   // v67: o card mostra só a variação mês anterior → mês atual (pedido 23/10)
    // v50: o rodapé passou a carregar o PERÍODO INTEIRO (primeiro → último mês lançado da
    // seleção), porque o topo agora mostra mês contra mês anterior.
    const ptsF = sel.filter(i => d.meses[i]!==null && d.meses[i]!==undefined && !isNaN(d.meses[i]));
    const ini=ptsF.length?ptsF[0]:sel[0], fim=ptsF.length?ptsF[ptsF.length-1]:sel[sel.length-1];
    const vIni=d.meses[ini], vFim=d.meses[fim];
    // com menos de 3 meses lançados o período é a mesma conta do topo — não repete
    const dt3 = (ptsF.length<3) ? null : deltaTxt(vIni, vFim, ind);
    if(dt3){
      const cls=sc||'neu';
      const txt = dt3.diff===0
        ? `De ${MESES_FULL[ini]} a ${MESES_FULL[fim]}: estável`
        : `De ${MESES_FULL[ini]} a ${MESES_FULL[fim]}: ${dt3.arrow} <strong>${dt3.txt}</strong>`;
      insightH=`<div class="ic-insight ${cls}">${txt}</div>`;
    }
  }

  // Barra de desempenho vs. referência — META (alcançar) ou LIMITE (não ultrapassar)
  const isLimite = ind.invertido;                 // invertido = limite/teto (menor é melhor)
  const refLbl   = isLimite ? 'Limite' : 'Meta';
  const compLbl  = refLbl;   // 'Meta' / 'Limite' — a frase completa vai no lado direito
  // v67b: duas linhas contra a meta - último mês e consolidado do período (pedido 23/10: eles não trocam o período)
  const nPer = d ? sel.filter(i=>d.meses[i]!==null&&d.meses[i]!==undefined&&!isNaN(d.meses[i])).length : 0;
  let goalH;
  if(meta===null){
    goalH = `<div class="ic-meta">${refLbl}: <strong>&mdash;</strong></div>`;
  } else {
    goalH = v67Goal(ind, cur, meta, '<span class="v67-tag">'+(mF!==null?MESES[mF]:'Mês')+'</span>', null);
    if(sel.length>1 && nPer>1){
      const mP = metaEfetiva(ind, d, sel);
      const nA = (mP!==null && metaMes) ? Math.round(mP/metaMes) : 1;
      goalH += v67Goal(ind, perV, mP, '<span class="v67-tag">Consolidado '+periodoLbl(sel)+'</span>', nA>1 ? fmtMeta(metaMes,ind)+'/mês × '+nA : null);
    }
  }

  return `<div class="ind-card" id="card_${ind.id}" onclick="toggleExpand('card_${ind.id}','${ind.id}')">
  <div class="ic-head">
    <div class="ic-label"${labelStyleAttr}>${titulo?escH(titulo):ind.label}</div>
    <div style="display:flex;align-items:center;gap:6px;">
      ${false ? '<span class="cons-badge" title="'+consTip+'">'+(sel.length===12?'ANO':'PERÍODO')+'</span>' : ''}
      <div class="semaforo ${sc}" title="${sc||'sem meta'}"></div>
    </div>
  </div>
  ${dualH || `<div class="ic-value ${vFmt?'':'vazio'}">${vFmt||'Aguardando dados'}</div>`}
  ${dualH ? '' : `<div class="ic-deltas">${momH}</div>`}
  ${metaMes!==null?`<div class="ic-chartcap"><span class="ic-cap-dash"></span>${refLbl} ${metaMesD}${(meta!==null&&metaMes!==null&&meta!==metaMes)?' / mês':''}</div>`:''}
  ${realCount===0
    ? `<div class="ic-chart ic-chart-single"><div class="ic-single-note">Aguardando o primeiro lançamento.</div></div>`
    : `<div class="ic-chart"><canvas id="ch_${ind.id}"></canvas></div>`
  }
  ${insightH}
  ${goalH}
</div>`;
}

function toggleExpand(cardId, indId){
  const card = document.getElementById(cardId);
  if(!card) return;
  const wasExpanded = card.classList.contains('expanded');
  const area = AREAS.find(a=>a.id===ST.tab);
  const ind = area ? area.indicadores.find(i=>i.id===indId) : null;
  // Colapsar todos e redesenhar os que estavam expandidos no tamanho normal
  document.querySelectorAll('.ind-card.expanded').forEach(c=>{
    c.classList.remove('expanded');
    const oid = c.id.replace('card_','');
    const oind = area ? area.indicadores.find(i=>i.id===oid) : null;
    if(oind) setTimeout(()=>buildOneChart(oind,false),60);
  });
  if(!wasExpanded){
    card.classList.add('expanded');
    if(ind) setTimeout(()=>buildOneChart(ind,true),60);
  }
}

// BUILD CHARTS
function buildCharts(area){
  area.indicadores.forEach(ind=>{ buildOneChart(ind,false); });
}

function buildOneChart(ind, expanded){
  const ctx = document.getElementById('ch_'+ind.id);
  if(!ctx) return;
  // Destruir instância anterior se existir
  if(ST.charts['ch_'+ind.id]){ try{ST.charts['ch_'+ind.id].destroy();}catch(e){} }

  const d = getData(ind);
  const sel = getMesesSelecionados();
  const allVals = d ? d.meses : Array(12).fill(null);
  const isTaxa = ind.tipo==='Taxa/%';
  const isInv = ind.invertido;
  const col = C.chart;
  const colFade = C.chartFade;
  let type = isTaxa ? 'line' : 'bar';

  // Exibe só os meses com dado lançado na planilha (tendência do que já existe);
  // destaca o período selecionado. Meses ainda vazios (null) não aparecem no eixo.
  const selSet = new Set(sel);
  const isSelIdx = i => selSet.has(i);
  const popIdx = [];
  allVals.forEach((v,i)=>{ if(v!==null && v!==undefined && !isNaN(v)) popIdx.push(i); });
  // Com 1 ou 2 pontos reais, "gráfico de linha" não é gráfico: 1 ponto vira um círculo solto no ar
  // e 2 pontos viram um bloco preenchido de ponta a ponta, com os pontos cortados nas bordas.
  // Nos dois casos mostra como coluna — o mesmo dado, com peso visual de verdade (v48).
  if(type==='line' && popIdx.length<=2) type='bar';
  const labels = popIdx.map(i=>MESES[i]);
  const vals = popIdx.map(i=>allVals[i]);
  const mFc = d ? focoMes(d, sel) : null;                     // v67: mês em foco
  const bgColors = popIdx.map(i=> i===mFc?col:(isSelIdx(i)?'rgba(143,178,240,0.62)':colFade));   // barras
  const ptRadius = popIdx.map(i=> i===mFc?6:(isSelIdx(i)?3.5:2));   // pontos (linha)
  const ptColors = popIdx.map(i=> i===mFc?'#E0EEE7':col);
  // v67: rótulo em todos os pontos. Com muitos meses e pouca largura (zoom), os rótulos dos meses
  // fora de foco ficam deitados dentro da coluna (barras) ou alternam acima/abaixo (linha), e o R$ sai do texto.
  const nPts = popIdx.length;
  const lblTxt = (v,k)=>{ let t=fmtVal(v,ind)||''; if(ind.moeda && popIdx[k]!==mFc && nPts>6) t=t.replace(/R\$ /,''); return t; };
  const crowd = (c)=>{ const a=c.chart.chartArea; if(!a) return nPts>8; const fs=nPts>8?11:12;
    const w=Math.max(...vals.map((v,k)=>lblTxt(v,k).length))*fs*0.62; return a.width/nPts < w+6; };
  const deitado = (c)=> type==='bar' && popIdx[c.dataIndex]!==mFc && crowd(c);

  // Rótulos nos pontos/barras: sempre visíveis
  const showLabels = true;

  const metaVal = d ? d.meta : null;
  const metaDataset = metaVal !== null ? [{
    data: labels.map(()=>metaVal),
    borderColor:'rgba(224,238,231,0.9)',   // v66-B: meta navy forte sobre o card claro
    borderWidth:2,
    borderDash:[6,4],
    pointRadius:0,pointHoverRadius:0,
    fill:false,tension:0,spanGaps:true,clip:false,type:'line',
    // Dentro do gráfico só entram os valores do próprio dado. A tracejada é nomeada na
    // legenda acima do gráfico e o número aparece no rodapé — repetir aqui polui a plotagem (v49).
    datalabels:{display:false}
  }] : [];

  // Escala Y com números redondos (nice numbers) — sempre começando em 0, exceto quando o
  // próprio indicador pode ser negativo (ex.: Variação Saldos, YoY). Passo e decimais vêm
  // juntos, pra nunca arredondar dois ticks diferentes pro mesmo número exibido.
  let yMin=0, yMax=1, yStep=1, yDecimals=0;
  {
    const nums = vals.filter(v=>v!==null && v!==undefined && !isNaN(v));
    if(metaVal!==null) nums.push(metaVal);
    if(nums.length){
      const hiRaw=Math.max(...nums), loRaw=Math.min(...nums);
      const isCount = ind.tipo!=='Taxa/%' && !ind.moeda && nums.every(v=>Number.isInteger(v));
      const lo = loRaw<0 ? loRaw : 0;
      // v50: o eixo acompanha o próprio dado. O topo é o maior entre a série e a meta/limite
      // (metaVal já entrou em nums), arredondado pelo nice number. O piso continua em 0.
      // O mínimo fixo de 100% para Taxa/% saiu: achatava indicadores pequenos (0,5% virava
      // um traço colado no zero) e cortava os que passam de 100% (ocupação de agenda).
      let hi = hiRaw;
      if(hi<=lo) hi = lo + 1;
      const ns = niceScale(lo, hi, 5, isCount);
      yMin=ns.min; yMax=ns.max; yStep=ns.step; yDecimals=ns.decimals;
    }
  }

  ST.charts['ch_'+ind.id] = new Chart(ctx,{
    type,
    data:{
      labels,
      datasets:[{
        data:vals,
        borderColor:col,
        // Linha: degradê que some no rodapé, para a área não competir com o número do card.
        backgroundColor: type==='line'
          ? (c)=>{
              const {ctx:cx, chartArea} = c.chart;
              if(!chartArea) return colFade;
              const g = cx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
              g.addColorStop(0, colFade);
              g.addColorStop(1, 'rgba(143,178,240,0.03)');
              return g;
            }
          : bgColors,
        maxBarThickness: expanded?96:64,   // em tela cheia, 2 barras não viram duas lajes
        borderWidth:type==='line'?3:0,
        fill:type==='line',
        tension:0,   // v50: reta entre pontos — a curva sugeria valores intermediários que não existem
        pointRadius: type==='line'?ptRadius:0,
        pointBackgroundColor: type==='line'?ptColors:undefined,
        pointHoverRadius:5,
        borderRadius:type==='bar'?4:0,
        spanGaps:true,
        clip: false,
        datalabels: {
          display:true,                                    // v67: valor em cima de todos os pontos e colunas
          color:(c)=> deitado(c)?'#FFFFFF':'#E0EEE7',
          clamp:true,
          rotation:(c)=> deitado(c)?-90:0,
          font:(c)=>{ const f=popIdx[c.dataIndex]===mFc; return {size:f?(expanded?16:14):(popIdx.length>8?11:(expanded?14:12)),weight:f?'800':'600',family:'Montserrat'}; },
          anchor:type==='bar'?'end':'top',
          align:(c)=> deitado(c) ? 'start' : (type==='line' && popIdx[c.dataIndex]!==mFc && crowd(c) && (nPts-1-c.dataIndex)%2 ? 'bottom' : 'top'),
          offset:(c)=> deitado(c)?4:6,
          formatter:(v,c)=>v!==null?lblTxt(v,c.dataIndex):'',
        }
      }, ...metaDataset]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top: showLabels?22:4, right: showLabels?20:6, bottom:2, left: showLabels?20:6 } },
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:C.navy,titleColor:C.mint,bodyColor:'#fff',
          padding:12,cornerRadius:6,
          callbacks:{
            title:c=>labels[c[0].dataIndex],
            label:c=>{
              if(c.raw===null) return '—';
              const d2=getData(ind);
              const meta=d2?d2.meta:null;
              const v=c.raw;
              const linhas=[' Valor: '+fmtVal(v,ind)];
              if(meta!==null){
                linhas.push((ind.invertido?' Limite:':' Meta:  ')+fmtMeta(meta,ind));
                const dist=ind.tipo==='Taxa/%'
                  ?fmtNum(v-meta)+' p.p.'
                  :(meta===0
                      ? fmtVal(v-meta,ind)                                        // meta zero: diferença absoluta
                      : fmtNum((v-meta)/Math.abs(meta)*100)+'%');
                const sinal=v>=meta?'+':'';
                linhas.push(' Dist.: '+(sinal+dist));
              }
              return linhas;
            }
          }
        }
      },
      scales:{
        x:{
          display: true,
          offset:true,                 // meia categoria de folga nas pontas: o dado nunca encosta na moldura
          grid:{display:false},
          ticks:{
            color:'#E0EEE7',
            // v66d: com muitos meses a fonte do eixo diminui um pouco para caber Jan…Dez sem pular mês
            font:(c)=>({size:(c.chart.data.labels||[]).length>8?11:13,weight:'600',family:'Montserrat'}),
            maxRotation:0, autoSkipPadding:2
          },
          border:{display:false}
        },
        y:{
          display:true,
          min:yMin, max:yMax,
          grid:{color:C.grid, drawTicks:false},
          border:{display:false},
          ticks:{
            stepSize:yStep,
            color:'#E0EEE7',
            font:{size:13,weight:'600',family:'Montserrat'},
            padding:4,
            callback:(v)=>fmtAxisTick(v,ind,yDecimals)
          }
        }
      }
    }
  });
}

const CHECAGENS = [];   // v66: aviso "vidas únicas > atendimentos" removido — vidas únicas soma Sishosp + Amplimed + Saúde do Trabalhador (Janis, 16/10)

function nf(v,dec){            // v64: dec 0 = contagem inteira; qualquer outro caso segue a regra única (fmtNum)
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(dec===0) return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
  return fmtNum(v);
}
function nfEixo(v,dec){        // rótulo de eixo: casas do passo da escala, fora da regra de exibição
  if(v===null||v===undefined||isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:(dec===undefined?1:dec)});
}
function escH(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function parseLayout(rows){
  const out=[];
  (rows||[]).forEach(r=>{
    const f=(r[0]||'').trim().toUpperCase();
    if(f!=='INDICADOR' && f!=='BRUTO') return;          // pula cabeçalho e linhas vazias
    out.push({ fonte:f, area:(r[1]||'').trim(), rotulo:(r[2]||'').trim(), titulo:(r[3]||'').trim(),
      subaba:(r[4]||'').trim()||'Outros', ordem:parseNum(r[5])??999, visual:(r[6]||'card').trim().toLowerCase(),
      destaque:/^s/i.test((r[7]||'').trim()), grupo:(r[8]||'').trim() });
  });
  return out;
}
function parseBrutos(rows){
  const out=[];
  (rows||[]).forEach(r=>{
    const dado=(r[1]||'').trim();
    if(!dado || dado.toUpperCase()==='DADO') return;
    const meses=[]; for(let c=4;c<=15;c++) meses.push(parseNum(r[c]));
    out.push({ area:(r[0]||'').trim(), dado, alimenta:(r[2]||'').trim(),
      consolida:((r[3]||'SOMA').trim().toUpperCase()), meses, cons:parseNum(r[16]) });
  });
  return out;
}

// ---- Leitura das abas extras (só no modo ao vivo) ----
async function lerAbaExtra(range, real){
  const url='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(range)+'?t='+Date.now()+(real?'&valueRenderOption=UNFORMATTED_VALUE':'');
  const res=await fetch(url,{ headers:{'Authorization':'Bearer '+ACCESS_TOKEN}, cache:'no-store' });
  if(res.ok){ const j=await res.json(); return { rows:j.values||[] }; }
  let msg='HTTP '+res.status;
  try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg+=' — '+j.error.message; }catch(_e){}
  return { erro:msg, ausente: res.status===400 && /parse range/i.test(msg) };
}
async function carregarExtras(){
  const [lay,bru,nts]=await Promise.all([lerAbaExtra(LAYOUT_RANGE), lerAbaExtra(BRUTOS_RANGE, true), lerAbaExtra(NOTAS_RANGE)]);
  EXT.notas = nts.rows ? parseNotas(nts.rows) : [];   // aba NOTAS opcional: ausente = sem notas, sem erro
  EXT.notasOrigem = nts.rows ? 'aba NOTAS da central' : (nts.ausente ? 'a aba NOTAS ainda não existe' : 'erro ao ler NOTAS: '+nts.erro);
  if(lay.rows && parseLayout(lay.rows).length){ EXT.layout=parseLayout(lay.rows); aplicarOcultos(); EXT.layoutOrigem='aba LAYOUT da central'; }
  else { EXT.layout=parseLayout(LAYOUT_PADRAO); aplicarOcultos();
    EXT.layoutOrigem = lay.ausente ? 'padrão embutido (a aba LAYOUT ainda não existe)'
                     : lay.erro ? 'padrão embutido (erro ao ler LAYOUT: '+lay.erro+')' : 'padrão embutido (aba LAYOUT vazia)'; }
  if(bru.rows){ EXT.brutos=parseBrutos(bru.rows); EXT.brutosOrigem='aba BRUTOS da central'; }
  else { EXT.brutos=[]; EXT.brutosOrigem = bru.ausente ? 'a aba BRUTOS ainda não existe' : 'erro ao ler BRUTOS: '+bru.erro; }
}
const _fetchSheetBase = fetchSheet;

};

function indPorRotulo(rotulo){
  const s=slug(rotulo);
  for(const area of AREAS) for(const ind of area.indicadores)
    if(ind.id===s || slug(ind.label)===s) return { area, ind };
  return null;
}
// v65: LAYOUT com visual "oculto" tira o indicador do dashboard (a planilha continua medindo).
function aplicarOcultos(){
  const oc=new Set((EXT.layout||[]).filter(e=>e.fonte==='INDICADOR'&&e.visual==='oculto').map(e=>slug(e.rotulo)));
  AREAS.forEach(a=>{ if(!a._todos) a._todos=a.indicadores.slice(); a.indicadores=a._todos.filter(i=>!oc.has(i.id)&&!oc.has(slug(i.label))); });
}
function layoutDaArea(area){
  if(!EXT.layout) return null;
  const ents=EXT.layout.filter(e=>e.fonte==='INDICADOR'&&e.visual!=='oculto').map(e=>{ const h=indPorRotulo(e.rotulo); return h&&h.area.id===area.id ? {...e, ind:h.ind} : null; }).filter(Boolean);
  if(!ents.length) return null;
  const noLayout=new Set(ents.map(e=>e.ind.id));
  area.indicadores.forEach((ind,i)=>{ if(!noLayout.has(ind.id)) ents.push({fonte:'INDICADOR',area:area.label,rotulo:ind.label,titulo:'',subaba:'Outros',ordem:9000+i,visual:'card',destaque:false,grupo:'',ind}); });
  return ents.sort((a,b)=>a.ordem-b.ordem);
}
function tituloEnt(e){ return e.titulo || e.ind.label.replace(/\s*\((%|R\$|min|dias|horas|vezes)\)\s*$/,''); }
function brutoPor(area,dado){ const a=slug(area), d=slug(dado); return EXT.brutos.find(b=>slug(b.area)===a && slug(b.dado)===d) || null; }
function brutosDoInd(ind){ const s=ind.id, l=slug(ind.label); return EXT.brutos.filter(b=>{ const x=slug(b.alimenta); return x && (x===s||x===l); }); }
function ehComposicao(ind){ const e=EXT.layout&&EXT.layout.find(x=>x.fonte==='INDICADOR'&&slug(x.rotulo)===slug(ind.label)); return !!(e&&e.visual==='composicao'); }

function periodoLbl(sel){
  // v64: o texto escreve os meses ("Jun–Ago"), nunca "período completo"
  if(sel.length===1) return MESES[sel[0]];
  const contiguo=sel.every((v,i)=>i===0||v===sel[i-1]+1);
  return contiguo ? MESES[sel[0]]+'–'+MESES[sel[sel.length-1]] : sel.length+' meses';
}
function leitura(ind,sel){
  const d=getData(ind); if(!d) return {d:null,cur:null,meta:null,sc:'sem',m:null};
  const m=focoMes(d,sel), sf=m===null?sel:[m];
  const cur=m===null?null:calcCurVal(d,sf), meta=metaEfetiva(ind,d,sf);
  return { d, cur, meta, m, sc: semCls(cur,meta,ind.invertido)||'sem' };
}
function valBruto(b,sel){
  const vs=sel.map(i=>b.meses[i]).filter(v=>v!==null&&v!==undefined&&!isNaN(v));
  if(!vs.length) return {v:null,rot:''};
  if(sel.length===1) return {v:vs[0],rot:''};
  const r=b.consolida;
  if(r==='MÉDIA'||r==='MEDIA') return {v:vs.reduce((s,x)=>s+x,0)/vs.length,rot:'média'};
  if(r==='ÚLTIMO'||r==='ULTIMO'||r==='NENHUM'){ const i=[...sel].reverse().find(k=>b.meses[k]!==null&&b.meses[k]!==undefined); return {v:b.meses[i],rot:'em '+MESES[i]}; }
  return {v:vs.reduce((s,x)=>s+x,0),rot:'soma'};
}
function deltaHtml(cur,prev,ind){
  if(cur===null||prev===null||prev===undefined||isNaN(prev)) return '';
  const diff=cur-prev; if(Math.abs(diff)<1e-9) return '<span class="v51-dl neutro">= mês anterior</span>';
  const better=ind? (ind.invertido?diff<0:diff>0) : null;
  const arr=diff>0?'▲':'▼';
  const rel=prev!==0? ' ('+nf(Math.abs(diff/prev*100),1)+'%)' : '';
  const txt= ind&&ehNPS(ind) ? `${arr} ${fmtNum(Math.abs(diff))} ${Math.abs(diff)===1?'ponto':'pontos'}`
           : ind&&ind.tipo==='Taxa/%' ? `${arr} ${fmtNum(Math.abs(diff))} p.p.${rel}` : `${arr} ${fmtNum(Math.abs(prev!==0?diff/prev*100:0))}%`;
  return `<span class="v51-dl ${better===null?'neutro':(better?'bom':'ruim')}">${txt}</span>`;
}
function sparkSvg(meses,sel){
  const pts=meses.map((v,i)=>({v,i})).filter(p=>p.v!==null&&p.v!==undefined&&!isNaN(p.v));
  if(pts.length<2) return '';
  const W=132,H=34,max=Math.max(...pts.map(p=>p.v)),min=Math.min(0,...pts.map(p=>p.v));
  const x=i=>4+(W-8)*(i-pts[0].i)/Math.max(1,pts[pts.length-1].i-pts[0].i), y=v=>H-4-(H-8)*(v-min)/Math.max(1e-9,max-min);
  const line=pts.map(p=>x(p.i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const s=pts.filter(p=>sel.includes(p.i));
  return `<svg class="v51-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${line}"/>${s.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3"/>`).join('')}</svg>`;
}

// ================= RESUMO DA DIREÇÃO (substitui a antiga capa) =================
function htmlResumo(){
  const sel=getMesesSelecionados(), lbl=periodoLbl(sel), mUlt=sel[sel.length-1];
  // Volume do mês
  const vols=(EXT.layout||[]).filter(e=>e.fonte==='BRUTO'&&e.subaba.toUpperCase()==='RESUMO').sort((a,b)=>a.ordem-b.ordem);
  const volTit=e=>{ const t=e.titulo||e.rotulo; return t.replace(/\s+no m[eê]s$/i,''); };   // período: "Atendimentos", não "no mês"
  const volH=vols.map(e=>{
    const b=brutoPor(e.area,e.rotulo);
    if(!b) return `<div class="v51-vol vazio"><div class="v51-vol-t">${escH(volTit(e))}</div><div class="v51-vol-v">—</div><div class="v51-vol-s">aguardando aba BRUTOS</div></div>`;
    // v67: o número grande é o último mês lançado; a soma do período fica embaixo, escrita como soma
    const mB=focoMes(b,sel), v= mB===null?null:b.meses[mB];
    let pI=null; if(mB!==null) for(let i=mB-1;i>=0;i--){ const x=b.meses[i]; if(x!==null&&x!==undefined&&!isNaN(x)){ pI=i; break; } }
    const pv= pI===null ? null : b.meses[pI];
    let dl='';
    if(v!==null&&pv!==null){
      const df=v-pv, rel=pv!==0?Math.abs(df/pv*100):null;
      dl = df===0 ? `<span class="v51-vd igual">= ${MESES[pI]}</span>`
         : `<span class="v51-vd ${df>0?'sobe':'cai'}">${df>0?'▲':'▼'} ${rel===null?nf(Math.abs(df),0):nf(rel,1)+'%'} vs ${MESES[pI]}</span>`;
    }
    const per = sel.length>1 ? valBruto(b,sel) : null;
    const perH = per&&per.v!==null&&per.v!==undefined ? `<span class="v51-vol-s">${periodoLbl(sel)}: ${per.rot==='soma'?'soma de ':''}${nf(per.v,0)}${per.rot&&per.rot!=='soma'?' ('+per.rot+')':''}</span>` : '';
    return `<div class="v51-vol"><div class="v51-vol-t">${escH(volTit(e))}</div><div class="v51-vol-v">${v===null?'—':nf(v,0)}</div><span class="v51-vol-s">${mB===null?'sem lançamento':MESES[mB]}</span>${dl}${perH}</div>`;
  }).join('');
  const avisos=CHECAGENS.map(c=>{
    const a=brutoPor(...c.a), b=brutoPor(...c.b); if(!a||!b) return '';
    const va=a.meses[mUlt], vb=b.meses[mUlt];
    return (va!==null&&vb!==null&&va!==undefined&&vb!==undefined&&va>vb) ? `<p class="v51-aviso">${c.msg(va,vb,MESES[mUlt])}</p>` : '';
  }).join('');

  // Semáforo por área e desvios
  let tv=0,ta=0,tr=0,tl=0; const desvios=[]; const porArea=[]; const focos=[];
  AREAS.forEach(area=>{
    const c={verde:0,amarelo:0,vermelho:0,sem:0};
    area.indicadores.forEach(ind=>{
      if(ehComposicao(ind)) return;                       // composição não tem direção
      const L=leitura(ind,sel); c[L.sc]++; if(L.sc!=='sem') focos.push(L.m);
      if(L.sc==='vermelho'){
        const gap = L.meta!==0 ? (ind.invertido?(L.cur-L.meta):(L.meta-L.cur))/Math.abs(L.meta) : 1;
        desvios.push({area,ind,cur:L.cur,meta:L.meta,gap});
      }
    });
    tv+=c.verde; ta+=c.amarelo; tr+=c.vermelho; tl+=c.verde+c.amarelo+c.vermelho;
    porArea.push({area,c});
  });
  desvios.sort((a,b)=>(a.meta===0)-(b.meta===0) || b.gap-a.gap);
  const piorArea=porArea.slice().sort((a,b)=>b.c.vermelho-a.c.vermelho)[0];
  const lblF=lblFoco(focos,sel);
  let frase = tl===0 ? `Nenhum indicador com leitura em ${lbl}.`
    : `Em ${lblF}, ${tv} de ${tl} indicadores com leitura estão no alvo, ${ta} em atenção e ${tr} críticos.`;
  if(tr>0 && piorArea) frase+=` A maior concentração de críticos está em ${piorArea.area.label} (${piorArea.c.vermelho}).`;

  const areasH=porArea.map(({area,c})=>{
    const n=c.verde+c.amarelo+c.vermelho+c.sem||1, w=k=>(c[k]/n*100).toFixed(2)+'%';
    return `<button type="button" class="v51-arow" onclick="switchTab('${area.id}')">
      <span class="v51-arow-n">${area.num}</span><span class="v51-arow-l">${escH(area.label)}</span>
      <span class="v51-bar" aria-hidden="true"><i class="verde" style="width:${w('verde')}"></i><i class="amarelo" style="width:${w('amarelo')}"></i><i class="vermelho" style="width:${w('vermelho')}"></i><i class="sem" style="width:${w('sem')}"></i></span>
      <span class="v51-arow-c"><b class="t-verde">${c.verde}</b> · <b class="t-amarelo">${c.amarelo}</b> · <b class="t-vermelho">${c.vermelho}</b>${c.sem?` · <span class="t-sem">${c.sem} sem leitura</span>`:''}</span></button>`;
  }).join('');
  const desvH=desvios.slice(0,8).map(x=>`<button type="button" class="v51-drow" onclick="switchTab('${x.area.id}')">
      <span class="v51-drow-a">${escH(x.area.label)}</span><span class="v51-drow-i">${escH(nomeInd(x.ind))}</span>
      <span class="v51-drow-v">${fmtVal(x.cur,x.ind)??'—'} <em>${rotMeta(x.ind,x.meta)} ${fmtMeta(x.meta,x.ind)??'—'}</em></span></button>`).join('');

  return `<div class="tab-panel active"><section class="v51-resumo">
  <header class="v51-rhead">
    <span class="v51-selo v51-selo-g"><img src="${LOGO_AHCROS}" alt="AHCROS"></span>
    <div><h2 class="v51-h2">Resumo executivo</h2>
    <p class="v51-sub">Leitura do último mês lançado · período ${lbl}</p></div>
  </header>
  <p class="v51-frase">${frase}</p>
  <h3 class="v51-h3">Volume do último mês</h3>
  <div class="v51-vols">${volH||'<p class="v51-nota">Nenhum dado bruto marcado para o Resumo na aba LAYOUT.</p>'}</div>
  ${avisos}
  <div class="v51-cols">
    <div><h3 class="v51-h3">Situação por área</h3><div class="v51-areas">${areasH}</div></div>
    <div><h3 class="v51-h3">Maiores desvios</h3>${desvH?`<div class="v51-desv">${desvH}</div>`:'<p class="v51-nota">Nenhum indicador crítico no período.</p>'}</div>
  </div>
  <p class="v51-nota">Organização: ${escH(EXT.layoutOrigem||'—')}. Dados brutos: ${escH(EXT.brutosOrigem||'—')}.</p>
</section></div>`;
}

// v57 — "meta" para quem deve atingir; "limite" para teto (invertido), como no card completo.
// Meta zero de evento (IRAS, erros, quedas) segue "meta": é o termo usado pela área.
// v64: invertido = "limite" em todos os textos, inclusive com limite zero (decisão 01/10).
